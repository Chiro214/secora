databases:
  - name: secora-db
    databaseName: secora
    user: secora
    plan: free

services:
  - type: redis
    name: secora-redis
    plan: free

  - type: web
    name: secora-backend
    env: docker
    rootDir: backend
    plan: free
    dockerCommand: "npx prisma db push && node src/scripts/seedTemplates.js && npm start"
    envVars:
      - key: RENDER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: secora-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: secora-redis
          property: connectionString
      - key: CORS_ORIGIN
        value: "https://secora-seven.vercel.app"

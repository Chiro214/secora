databases:
  - name: secora-db
    databaseName: secora
    user: secora
    plan: free

services:
  - type: redis
    name: secora-redis
    plan: free

  - type: web
    name: secora-backend
    env: docker
    rootDir: backend
    plan: free
    dockerCommand: "npx prisma migrate deploy && npm start"
    envVars:
      - key: RENDER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: secora-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: secora-redis
          property: connectionString
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: secora-frontend
          property: url

  - type: web
    name: secora-frontend
    env: node
    rootDir: frontend
    plan: free
    buildCommand: "npm ci && npm run build"
    startCommand: "npm start"
    envVars:
      - key: RENDER
        value: "true"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: secora-backend
          property: url

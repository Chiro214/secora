name: SECORA DAST Scan

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to scan'
        required: true

jobs:
  secora-scan:
    if: github.event.deployment_status.state == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install SECORA CLI
        run: |
          # In a real environment, you might fetch a standalone binary or an npm package.
          # Here we simulate having the CLI available.
          npm install -g axios commander
          curl -O https://raw.githubusercontent.com/secora-io/secora/main/backend/secora-cli.js
          chmod +x secora-cli.js

      - name: Determine Target URL
        id: set_target
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "URL=${{ github.event.inputs.target_url }}" >> $GITHUB_ENV
          else
            echo "URL=${{ github.event.deployment_status.environment_url }}" >> $GITHUB_ENV
          fi

      - name: Run SECORA Scan
        env:
          SECORA_API_KEY: ${{ secrets.SECORA_API_KEY }}
          SECORA_ENDPOINT: "https://api.secora.io/api"
        run: |
          echo "Scanning $URL..."
          ./secora-cli.js -u "$URL" -a "$SECORA_API_KEY" -e "$SECORA_ENDPOINT" --fail-on HIGH

      - name: Post Results to PR (Optional)
        if: always()
        run: |
          # Custom script to comment the report URL on the PR if it fails
          echo "Scan completed. View full report at SECORA Dashboard."

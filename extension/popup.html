<!DOCTYPE html>
<html>
<head>
  <title>SECORA Macro Recorder</title>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 15px;
      background: #0a0a0a;
      color: #fff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #333;
    }
    .header h1 {
      font-size: 16px;
      margin: 0;
      color: #818cf8;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    #startBtn {
      background: #4f46e5;
      color: white;
    }
    #startBtn:hover {
      background: #4338ca;
    }
    #stopBtn {
      background: #ef4444;
      color: white;
      display: none;
    }
    #stopBtn:hover {
      background: #dc2626;
    }
    #exportBtn {
      background: #10b981;
      color: white;
      display: none;
    }
    #exportBtn:hover {
      background: #059669;
    }
    #clearBtn {
      background: transparent;
      color: #9ca3af;
      border: 1px solid #374151;
    }
    #clearBtn:hover {
      background: #1f2937;
    }
    .status {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 15px;
      text-align: center;
    }
    #stepCount {
      font-weight: bold;
      color: #e5e7eb;
    }
    .recording-indicator {
      width: 10px;
      height: 10px;
      background: #ef4444;
      border-radius: 50%;
      display: none;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="recording-indicator" id="indicator"></div>
    <h1>SECORA Macro Recorder</h1>
  </div>
  
  <button id="startBtn">Start Recording</button>
  <button id="stopBtn">Stop Recording</button>
  <button id="exportBtn">Export Macro (JSON)</button>
  <button id="clearBtn">Clear</button>

  <div class="status">
    Recorded Steps: <span id="stepCount">0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>

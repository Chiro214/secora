name: 🔒 Security Scan Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly security scans
    - cron: '0 2 * * 1'  # Every Monday at 2 AM
  workflow_dispatch:  # Manual trigger

jobs:
  dependency-scan:
    name: 📦 Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies (Backend)
        working-directory: ./backend
        run: npm ci
      
      - name: Install dependencies (Frontend)
        working-directory: ./frontend
        run: npm ci
      
      - name: Run npm audit (Backend)
        working-directory: ./backend
        run: |
          npm audit --audit-level=moderate --json > ../backend-audit.json || true
          npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Run npm audit (Frontend)
        working-directory: ./frontend
        run: |
          npm audit --audit-level=moderate --json > ../frontend-audit.json || true
          npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: |
            backend-audit.json
            frontend-audit.json

  snyk-scan:
    name: 🐍 Snyk Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects

  semgrep-scan:
    name: 🔍 Semgrep SAST Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/nodejs
            p/typescript
            p/owasp-top-ten
            p/jwt
            p/sql-injection
            p/xss
          generateSarif: true
      
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()

  secret-scan:
    name: 🔑 Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning
      
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  docker-scan:
    name: 🐳 Docker Image Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: |
          cd backend
          docker build -t secora-backend:${{ github.sha }} .
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secora-backend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  zap-scan:
    name: 🕷️ OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: ${{ secrets.STAGING_URL || 'http://localhost:3000' }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: false
      
      - name: Upload ZAP results
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-results
          path: report_html.html

  security-headers:
    name: 🛡️ Security Headers Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Check security headers
        run: |
          URL="${{ secrets.STAGING_URL || 'http://localhost:3000' }}"
          
          echo "Checking security headers for: $URL"
          
          HEADERS=$(curl -s -I "$URL")
          
          echo "=== Security Headers Report ==="
          
          # Check for required headers
          echo "$HEADERS" | grep -i "strict-transport-security" || echo "❌ Missing: Strict-Transport-Security"
          echo "$HEADERS" | grep -i "content-security-policy" || echo "❌ Missing: Content-Security-Policy"
          echo "$HEADERS" | grep -i "x-frame-options" || echo "❌ Missing: X-Frame-Options"
          echo "$HEADERS" | grep -i "x-content-type-options" || echo "❌ Missing: X-Content-Type-Options"
          echo "$HEADERS" | grep -i "referrer-policy" || echo "❌ Missing: Referrer-Policy"
          echo "$HEADERS" | grep -i "permissions-policy" || echo "❌ Missing: Permissions-Policy"
          
          # Check for headers that should NOT be present
          echo "$HEADERS" | grep -i "x-powered-by" && echo "⚠️  Found: X-Powered-By (should be removed)"
          echo "$HEADERS" | grep -i "server:" && echo "⚠️  Found: Server header (consider removing)"

  security-gate:
    name: 🚦 Security Quality Gate
    runs-on: ubuntu-latest
    needs: [dependency-scan, semgrep-scan, secret-scan]
    if: always()
    
    steps:
      - name: Check security scan results
        run: |
          echo "Security scans completed"
          echo "Review results in artifacts and SARIF uploads"
          
          # This job can be configured to fail the build based on severity
          # For now, it's informational
          
          if [ "${{ needs.secret-scan.result }}" == "failure" ]; then
            echo "❌ Secret scan failed - secrets detected!"
            exit 1
          fi
          
          echo "✅ Security gate passed"

  notify:
    name: 📢 Notify Security Results
    runs-on: ubuntu-latest
    needs: [security-gate]
    if: always() && github.event_name == 'push'
    
    steps:
      - name: Send notification
        run: |
          echo "Security scan completed for commit ${{ github.sha }}"
          echo "Results available in GitHub Actions artifacts"
          # Add Slack/Discord/Email notification here if needed
